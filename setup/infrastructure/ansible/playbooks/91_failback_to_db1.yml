---
# PRE-CHECKS

- name: Verify db-2 is currently primary
  hosts: postgres_standby
  become: true
  gather_facts: false

  tasks:

    - name: Check PostgreSQL role on db-2
      ansible.builtin.shell: |
        docker exec postgres psql \
          -U {{ postgres_user }} \
          -d {{ postgres_db }} \
          -tAc "SELECT pg_is_in_recovery();"
      register: db2_role
      changed_when: false

    - name: Abort if db-2 is not primary
      ansible.builtin.fail:
        msg: "Refusing failback because db-2 is not primary."
      when: db2_role.stdout | trim != "f"

# STOP APPLICATION WRITES

- name: Stop workers before failback
  hosts: middleware
  become: true
  gather_facts: false

  tasks:

    - name: Stop worker container
      ansible.builtin.shell: |
        docker stop worker || true
      changed_when: true

# REBUILD DB-1 FROM DB-2

- name: Rebuild db-1 as standby from db-2
  hosts: postgres_primary
  become: true
  gather_facts: false

  tasks:

    - name: Remove postgres container
      ansible.builtin.shell: |
        docker rm -f postgres || true
      changed_when: true

    - name: Clean PostgreSQL data directory
      ansible.builtin.shell: |
        rm -rf {{ postgres_data_dir }}/*
        chown -R 999:999 {{ postgres_data_dir }}
        chmod 700 {{ postgres_data_dir }}
      changed_when: true

    - name: Base backup from db-2
      ansible.builtin.shell: |
        docker run --rm \
          --user 999:999 \
          -e PGPASSWORD="{{ postgres_replication_password }}" \
          -v "{{ postgres_data_dir }}:/var/lib/postgresql/data" \
          {{ postgres_image }} \
          pg_basebackup \
          -h {{ db2_private_ip }} \
          -p {{ postgres_port }} \
          -U {{ postgres_replication_user }} \
          -D /var/lib/postgresql/data \
          -Fp \
          -Xs \
          -P \
          -R
      no_log: true
      changed_when: true

    - name: Start db-1 as standby
      community.docker.docker_container:
        name: "{{ postgres_container_name }}"
        image: "{{ postgres_image }}"
        state: started
        restart_policy: "{{ container_restart_policy }}"
        recreate: true
        published_ports:
          - "{{ postgres_port }}:5432"
        env:
          PGDATA: /var/lib/postgresql/data
        volumes:
          - "{{ postgres_data_dir }}:/var/lib/postgresql/data"

    - name: Verify db-1 is standby
      ansible.builtin.shell: |
        docker exec postgres psql \
          -U {{ postgres_user }} \
          -d {{ postgres_db }} \
          -tAc "SELECT pg_is_in_recovery();"
      register: db1_role
      retries: 20
      delay: 3
      until: db1_role.stdout | trim == "t"
      changed_when: false

# STOP DB-2 TO PREVENT SPLIT BRAIN

- name: Stop current primary db-2
  hosts: postgres_standby
  become: true
  gather_facts: false

  tasks:

    - name: Stop postgres container
      ansible.builtin.shell: |
        docker stop postgres
      changed_when: true

# PROMOTE DB-1

- name: Promote db-1 to primary
  hosts: postgres_primary
  become: true
  gather_facts: false

  tasks:

    - name: Promote PostgreSQL
      ansible.builtin.shell: |
        docker exec -u postgres postgres \
          psql -U {{ postgres_user }} \
          -d {{ postgres_db }} \
          -c "SELECT pg_promote();"
      changed_when: true
    
    - name: Wait until db-1 becomes primary
      ansible.builtin.shell: |
        docker exec postgres psql \
          -U {{ postgres_user }} \
          -d {{ postgres_db }} \
          -tAc "SELECT pg_is_in_recovery();"
      register: db1_primary
      retries: 20
      delay: 3
      until: db1_primary.stdout | trim == "f"
      changed_when: false

# UPDATE ROUTE53

- name: Point writer DNS back to db-1
  hosts: localhost
  gather_facts: false

  vars:
    route53_target_ip: "{{ db1_private_ip }}"

  tasks:

    - name: Update Route53 writer record
      ansible.builtin.import_tasks:
        file: tasks/update_route53_writer.yml

# REBUILD DB-2 FROM DB-1

- name: Rebuild db-2 as standby
  hosts: postgres_standby
  become: true
  gather_facts: false

  tasks:

    - name: Remove postgres container
      ansible.builtin.shell: |
        docker rm -f postgres || true
      changed_when: true

    - name: Clean PostgreSQL data directory
      ansible.builtin.shell: |
        rm -rf {{ postgres_data_dir }}/*
        chown -R 999:999 {{ postgres_data_dir }}
        chmod 700 {{ postgres_data_dir }}
      changed_when: true

    - name: Base backup from db-1
      ansible.builtin.shell: |
        docker run --rm \
          --user 999:999 \
          -e PGPASSWORD="{{ postgres_replication_password }}" \
          -v "{{ postgres_data_dir }}:/var/lib/postgresql/data" \
          {{ postgres_image }} \
          pg_basebackup \
          -h {{ db1_private_ip }} \
          -p {{ postgres_port }} \
          -U {{ postgres_replication_user }} \
          -D /var/lib/postgresql/data \
          -Fp \
          -Xs \
          -P \
          -R
      no_log: true
      changed_when: true

    - name: Start db-2 as standby
      community.docker.docker_container:
        name: "{{ postgres_container_name }}"
        image: "{{ postgres_image }}"
        state: started
        restart_policy: "{{ container_restart_policy }}"
        recreate: true
        published_ports:
          - "{{ postgres_port }}:5432"
        env:
          PGDATA: /var/lib/postgresql/data
        volumes:
          - "{{ postgres_data_dir }}:/var/lib/postgresql/data"

    - name: Verify db-2 is standby
      ansible.builtin.shell: |
        docker exec postgres psql \
          -U {{ postgres_user }} \
          -d {{ postgres_db }} \
          -tAc "SELECT pg_is_in_recovery();"
      register: db2_role_after
      retries: 20
      delay: 3
      until: db2_role_after.stdout | trim == "t"
      changed_when: false

# Start the application

- name: Restart applications
  hosts: middleware:frontend
  become: true
  gather_facts: false

  tasks:

    - name: Restart worker and result containers
      ansible.builtin.shell: |
        docker restart worker 2>/dev/null || true
        docker restart result 2>/dev/null || true
      changed_when: true