---
- name: Validate PostgreSQL HA state
  hosts: postgres
  become: true
  tasks:
    - name: Check PostgreSQL recovery state
      ansible.builtin.shell: |
        docker exec postgres psql -U {{ postgres_user }} -d {{ postgres_db }} -c "SELECT pg_is_in_recovery();"
      register: recovery_state
      changed_when: false

    - name: Show recovery state
      ansible.builtin.debug:
        var: recovery_state.stdout

- name: Check replication from db-1 primary side
  hosts: postgres_primary
  become: true
  tasks:
    - name: Show pg_stat_replication
      ansible.builtin.shell: |
        docker exec postgres psql -U {{ postgres_user }} -d {{ postgres_db }} -c "SELECT usename, application_name, client_addr, state, sync_state FROM pg_stat_replication;"
      register: replication_state
      changed_when: false

    - name: Show replication state
      ansible.builtin.debug:
        var: replication_state.stdout

- name: Check writer DNS resolution
  hosts: middleware
  become: true
  tasks:
    - name: Resolve PostgreSQL writer DNS
      ansible.builtin.shell: |
        getent hosts {{ postgres_writer_fqdn }}
      register: writer_dns
      changed_when: false

    - name: Show writer DNS result
      ansible.builtin.debug:
        var: writer_dns.stdout