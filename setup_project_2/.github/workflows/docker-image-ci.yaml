name: CI Pipeline for Docker Images
 
on:
  push:
    branches: [ "advanced" ]
  pull_request:
    branches: [ "main" ]
 
jobs:
  build-test-and-docker:
    runs-on: ubuntu-latest
 
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
 
      - name: Build Docker images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/voting-app:v1.0.0 ./vote
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/worker-app:v1.0.0 ./worker
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/result-app:v1.0.0 ./result
 
      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/voting-app:v1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/worker-app:v1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/result-app:v1.0.0