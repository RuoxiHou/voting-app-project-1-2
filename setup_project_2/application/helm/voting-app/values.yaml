namespace: voting-app

# Shared defaults applied to the vote/result/worker/redis containers.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

vote:
  replicaCount: 2
  image: ${student_name}/voting-app:latest
  port: 80

worker:
  replicaCount: 2
  image: ${student_name}/worker-app:latest
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    # Scale up when the "votes" Redis list grows past this many pending entries per replica.
    redisListName: votes
    redisListLength: "5"

result:
  replicaCount: 2
  image: ${student_name}/result-app:latest
  port: 80

redis:
  replicaCount: 1
  image: redis:8-alpine
  serviceName: redis
  port: 6379

database:
  secretName: "voting-db"
  # Always supplied by Terraform (application/main.tf) from the
  # infrastructure module's db_secret_name output.
  awsSecretName: ""

hosts:
  vote: ""
  result: ""

ingress:
  certificateArn: ""
