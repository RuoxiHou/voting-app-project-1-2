---
apiVersion: v1
kind: Service
metadata:
  name: vote-service
  namespace: {{ .Values.namespace }}
  labels:
    app: vote

spec:
  type: ClusterIP

  selector:
    app: vote

  ports:
    - name: http
      port: {{ .Values.vote.port }}
      targetPort: {{ .Values.vote.port }}
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: {{ .Values.namespace }}
  labels:
    app: vote

spec:
  replicas: {{ .Values.vote.replicaCount }}

  selector:
    matchLabels:
      app: vote

  template:
    metadata:
      labels:
        app: vote

    spec:
      containers:
        - name: vote
          image: {{ .Values.vote.image }}
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: {{ .Values.vote.port }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: voting-app-config

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.vote.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.vote.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: vote